<style>
:root{--bg:#07080c;--bg2:#0c0e14;--card:#10131a;--line:#1f2430;--line2:#2a3040;--text:#eef0f4;--muted:#8c94a4;--dim:#5f6878;--lime:#c6ff3d;--red:#ff5c6c;

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--b);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(7,8,12,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;height:60px;gap:10px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--h);font-weight:700;font-size:15px;color:var(--text);text-decoration:none;white-space:nowrap}
.mark{width:30px;height:30px;border-radius:9px;background:var(--lime);display:grid;place-items:center}
.mark svg{width:17px;height:17px}
html[lang=kk]{--h:"Montserrat",system-ui,sans-serif}
html[lang=kk] h1,html[lang=kk] .sec h2{font-weight:800}
.lang{display:flex;border:1px solid var(--line2);border-radius:999px;padding:3px}
.lang button{background:none;border:0;cursor:pointer;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800;color:var(--muted)}
.lang button.on{background:var(--text);color:var(--bg)}
.progress{height:3px;background:var(--line)}
.progress i{display:block;height:100%;width:0;background:var(--lime);transition:width .3s}
.hero{padding:36px 0 8px}
.eb{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);margin-bottom:12px}
h1{font-family:var(--h);font-size:clamp(26px,6vw,40px);line-height:1.1;letter-spacing:-.02em;margin-bottom:14px}
.lead{color:var(--muted);font-size:16px}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0 6px}
.info div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:13px;color:var(--muted)}
.info b{display:block;color:var(--text);font-size:15px;margin-bottom:2px}
@media(max-width:560px){.info{grid-template-columns:1fr}}
.sec{margin-top:26px;border:1px solid var(--line);border-radius:22px;background:var(--card);padding:22px 18px}
.sec h2{font-family:var(--h);font-size:18px;display:flex;gap:10px;align-items:center;margin-bottom:4px}
.sec h2 span{flex:none;width:30px;height:30px;border-radius:9px;background:var(--lime);color:#0a0c06;display:grid;place-items:center;font-size:13px}
.sec .hint{color:var(--muted);font-size:14px;margin-bottom:8px}
.q{margin-top:18px}
.q label.t{display:block;font-weight:700;font-size:15px;margin-bottom:8px}
.q label.t small{font-weight:500;color:var(--dim);margin-left:4px}
.q .req{color:var(--red)}
input[type=text],input[type=tel],textarea{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;font-size:16px;outline:none;transition:border-color .2s}
textarea{min-height:88px;resize:vertical}
input:focus,textarea:focus{border-color:var(--lime)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:inline-block;padding:9px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);font-size:14px;font-weight:600;cursor:pointer;transition:.15s;user-select:none}
.opt input:checked+span{background:var(--lime);color:#0a0c06;border-color:var(--lime)}
.opt input:focus-visible+span{outline:2px solid var(--lime);outline-offset:2px}
.prep{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:12px}
.prep li{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.prep li::before{content:"□";color:var(--lime);font-weight:800}
.files{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:999px;font-weight:800;font-size:15px;border:0;cursor:pointer;text-decoration:none;text-align:center}
.btn-lime{background:var(--lime);color:#0a0c06}
.btn-ghost{background:transparent;border:1px solid var(--line2);color:var(--text)}
.submit{margin:28px 0 20px;display:flex;flex-direction:column;gap:10px}
.submit .btn{width:100%;min-height:58px;font-size:16px}
.err{color:var(--red);font-size:14px;min-height:20px}
.saved{color:var(--dim);font-size:13px;text-align:center}
footer{padding:20px 0 60px;color:var(--dim);font-size:13px;text-align:center}
.done{display:none;margin-top:16px;padding:16px;border-radius:16px;background:rgba(198,255,61,.08);border:1px solid rgba(198,255,61,.35);font-size:15px}

    const shown = k(opts[0], opts[1]);
    const sel = Array.isArray(v) ? v : (v != null ? [v] : []);
    return "<div class='q'><label class='t'>" + k(ru, kz) + star + (type === "check" ? " <small>" + T[LANG].many + "</small>" : "") + "</label><div class='opts'>" +
      shown.map((o, i) => "<label class='opt'><input type='" + (type === "check" ? "checkbox" : "radio") + "' name='" + id + "' value='" + i + "'" + (sel.includes(i) ? " checked" : "") + "><span>" + esc(o) + "</span></label>").join("") + "</div></div>";
  }
  return "<div class='q'><label class='t' for='" + id + "'>" + k(ru, kz) + star + "</label><input type='" + type + "' id='" + id + "' value='" + esc(v || "") + "'" + ph + (type === "tel" ? " inputmode='tel'" : "") + "></div>";
}
function collect(){
  S.forEach(sec => sec.q.forEach(([id, type]) => {
    if (type === "radio"){ const c = $("#f input[name='" + id + "']:checked"); data[id] = c ? +c.value : null; }
    else if (type === "check"){ data[id] = $$("#f input[name='" + id + "']:checked").map(c => +c.value); }
    else { const el = $("#" + id); data[id] = el ? el.value.trim() : ""; }
  }));
  save(); progress();
}
function filled(id, type){ const v = data[id]; return type === "check" ? Array.isArray(v) && v.length > 0 : v !== null && v !== undefined && v !== ""; }
function progress(){
  const all = S.flatMap(s => s.q);
  $("#bar").style.width = Math.round(all.filter(([id, type]) => filled(id, type)).length / all.length * 100) + "%";
}
function message(){
  const lines = ["*" + T[LANG].msgHead + "*", ""];
  S.forEach(sec => {
    if (!sec.q.some(([id, type]) => filled(id, type))) return;
    lines.push("*" + k(sec.ru, sec.kz) + "*");
    sec.q.forEach(([id, type, ru, kz, opts]) => {
      if (!filled(id, type)) return;
      let v = data[id];
      if (type === "radio") v = k(opts[0], opts[1])[v];
      else if (type === "check") v = v.map(i => k(opts[0], opts[1])[i]).join(", ");
      lines.push("• " + k(ru, kz) + ": " + v);
    });
    lines.push("");
  });
  return lines.join("\n").trim();
}
const missing = () => S.flatMap(s => s.q).filter(q => q[5] && !filled(q[0], q[1])).map(q => k(q[2], q[3]));
$("#send").onclick = () => {
  collect();
  const m = missing();
  if (m.length){ $("#err").textContent = T[LANG].req + " " + m.join(", "); $("#err").scrollIntoView({block:"center"}); return; }
  $("#err").textContent = "";
  window.open("https://wa.me/" + WA + "?text=" + encodeURIComponent(message()), "_blank", "noopener");
  $("#done").textContent = T[LANG].doneTxt; $("#done").style.display = "block";
};
$("#copy").onclick = async () => {
  collect();
  const txt = message();
  try { await navigator.clipboard.writeText(txt); }
  catch(e){ const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch(_){} ta.remove(); }
  $("#done").textContent = T[LANG].copied; $("#done").style.display = "block";
};
$$(".lang button").forEach(b => b.onclick = () => { collect(); LANG = b.dataset.l; try { localStorage.setItem("yl-lang", LANG); } catch(e){} render(); });
try { LANG = localStorage.getItem("yl-lang") === "kz" ? "kz" : "ru"; } catch(e){}
const qp = new URLSearchParams(location.search).get("lang"); if (qp) LANG = (qp === "kz" || qp === "kk") ? "kz" : "ru";
render();
</script>
